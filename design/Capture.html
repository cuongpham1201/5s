<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5S Daily — Capture</title>
<link rel="stylesheet" href="ds.css">
</head>
<body>
<div class="proto-tag">Capture.html · Employee · 390×844</div>
<div class="phone-stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar"><span>9:41</span><span class="sb-right">📶 📡 🔋</span></div>

    <div class="screen">
      <div class="app-header">
        <a class="back-btn" href="Home.html">←</a>
        <div class="grow"><div class="h2">Chuẩn bị chụp</div></div>
      </div>

      <div class="screen-pad">
        <!-- Department: READONLY (from M365) -->
        <label class="caption muted strong">Phòng ban</label>
        <div class="readonly-field mt-2">
          <div class="row gap-3">
            <div class="badge badge-info">PMKT</div>
            <span class="muted caption">Phòng Marketing</span>
          </div>
          <span class="rf-lock">🔒 Từ tài khoản</span>
        </div>

        <!-- Area: dynamic chip list -->
        <label class="caption muted strong" style="display:block;margin-top:24px">Khu vực <span style="color:var(--danger)">*</span></label>
        <div class="caption muted mb-3 mt-1">Chọn khu vực bạn đang chụp</div>
        <div class="chip-grid">
          <div class="chip is-selected"><span class="chip-ico">🏢</span> Văn phòng</div>
          <div class="chip"><span class="chip-ico">👥</span> Phòng họp</div>
          <div class="chip" style="grid-column:span 2"><span class="chip-ico">📦</span> Kho POSM</div>
        </div>

        <div class="card-flat mt-6" style="padding:14px 16px;display:flex;gap:10px;align-items:flex-start">
          <span style="font-size:18px">ℹ️</span>
          <span class="caption muted">Thời gian, vị trí GPS và người chụp sẽ được tự động gắn vào ảnh.</span>
        </div>
      </div>

      <!-- Sticky action -->
      <div class="pad-screen" style="border-top:1px solid var(--border)">
        <a class="btn btn-primary btn-lg btn-block" href="Camera.html">📷 Mở Camera</a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
