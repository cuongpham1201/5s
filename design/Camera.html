<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5S Daily — Camera</title>
<link rel="stylesheet" href="ds.css">
</head>
<body>
<div class="proto-tag">Camera.html · Employee · Fullscreen</div>
<div class="phone-stage">
  <div class="phone">
    <div class="notch"></div>

    <!-- Fullscreen camera (no statusbar/nav for immersion) -->
    <div class="camera">
      <!-- Top controls -->
      <div class="cam-top">
        <a class="cam-icon-btn" href="Capture.html" title="Đóng">✕</a>
        <div class="badge badge-neutral" style="background:rgba(0,0,0,.45);color:#fff">PMKT · Văn phòng</div>
        <button class="cam-icon-btn" title="Flash">⚡</button>
      </div>

      <!-- Framing guide -->
      <div class="cam-frame-hint"></div>

      <!-- Live camera placeholder -->
      <div class="cam-center">📷</div>

      <!-- Blurred live watermark preview -->
      <div class="cam-watermark">
        17:20 | 15/06/2026 · Thứ Hai<br>
        Lê Lợi / Hồng Gai / Quảng Ninh<br>
        PMKT · Văn phòng · Nguyễn Văn A<br>
        GPS: 20.9512, 107.0834 · ✓ 5S Verified
      </div>

      <!-- Bottom controls (thumb-reach zone) -->
      <div class="cam-controls">
        <div class="cam-thumb"><div style="width:100%;height:100%;background:linear-gradient(135deg,#cdd7e0,#8fa0b0)"></div></div>
        <a class="shutter" href="Preview.html" title="Chụp"></a>
        <button class="cam-side-btn" title="Đổi camera">🔄</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
